<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>

    {% include 'part/nav.html' %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for m in messages %}
            <p style="color:green;">{{ m }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>


    {% include 'part/footer.html' %}

    
</body>
</html>

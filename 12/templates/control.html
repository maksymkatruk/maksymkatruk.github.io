{% extends 'part/base.html' %}
    

{% block content %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Адмін Панель</h1>

        <form method="POST" action="/control" class="card p-3 shadow-sm mb-4">
            <div class="mb-3">
                <label for="name" class="form-label">Назва товару:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Ціна:</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" required>
            </div>
            <div class="mb-3">
                <label for="quantity" class="form-label">Кількість:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" required>
            </div>
            <button type="submit" class="btn btn-success">Додати товар</button>
        </form>

        <h3>Список товарів:</h3>
        <ul class="list-group">
            {% for food in foods %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ food.name }} — {{ food.price }}$ ({{ food.quantity }} шт)
                </li>
            {% endfor %}
        </ul>

        <a href="/" class="btn btn-primary mt-3">На головну</a>
    </div>
</body>
</html>


{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Товари</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html">Кошик</a>
                        </li>
                    </ul>
                    <div class="d-flex cart">

                        <a href="cart.html" class="btn btn-primary position-relative">
                            Cart
                            <span id="cart-count"
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                                <span class="visually-hidden">unread messages</span>
                            </span>
                        </a>


                    </div>

                </div>
            </div>
        </nav>
        <div id="cards" class="row">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        const products = [
            {
                id: "starlink-mini",
                title: "Супутникова система старлінк STARLINK Mini",
                price: 15490,
                image: "https://picsum.photos/seed/starlink/600/450",
            },
            {
                id: "starlink-gen3",
                title: "Комплект Starlink Gen 3 Rev 4 без акаунта",
                price: 19900,
                image: "https://picsum.photos/seed/starlink2/600/450",
            },
            {
                id: "redmi-note14",
                title: "Мобільний телефон Xiaomi Redmi Note 14 8/256GB",
                price: 7499,
                image: "https://picsum.photos/seed/phone/600/450",
            },
            {
                id: "e-bike",
                title: "Електровелосипед Crosser CR2 60V 20Ah",
                price: 24499,
                image: "https://picsum.photos/seed/ebike/600/450",
            },
            {
                id: "scooter",
                title: "Електросамокат Xiaomi Electric Scooter Elite GL",
                price: 18999,
                image: "https://picsum.photos/seed/scooter/600/450",
            },
            {
                id: "bike24",
                title: "Велосипед Ardis Flex 24",
                price: 9155,
                image: "https://picsum.photos/seed/bike/600/450",
            },
            {
                id: "router",
                title: "Маршрутизатор Xiaomi BE6500 Wi‑Fi 7",
                price: 4599,
                image: "https://picsum.photos/seed/router/600/450",
            },
            {
                id: "drill",
                title: "Шуруповерт акумуляторний Procraft PA221",
                price: 899,
                image: "https://picsum.photos/seed/drill/600/450",
            }
        ];
        for (let i = 0; i < products.length; i++) {
            const p = products[i];
            document.getElementById("cards").innerHTML += `
        
    <div class="card col-3">
        <img src="${p.image}" class="card-img-top" alt="">
        <div class="card-body">
            <h5 class="title">${p.title}</h5>
            <p class="price">${p.price} грн</p>
            <button class="btn btn-primary">У кошик</button>
        </div>
    </div>`
        }

    </script>
    <script>
        const cartCount = document.getElementById("cart-count");
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        updateCartCount();

        document.querySelectorAll(".btn.btn-primary").forEach((btn, index) => {
            btn.addEventListener("click", () => {
                const product = products[index];
                const existing = cart.find(item => item.id === product.id);

                if (existing) {
                    existing.quantity += 1;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }

                localStorage.setItem("cart", JSON.stringify(cart));
                updateCartCount();
            });
        });

        function updateCartCount() {
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = total;
        }
    </script>

</body>

</html>

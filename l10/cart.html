<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Ваш кошик</h1>
        <div id="cart-items" class="row mt-3"></div>

        <div class="mt-3">
            <h4>Загальна сума: <span id="total-price">0</span> грн</h4>
            <a href="./1.html" class="btn btn-secondary mt-2">← Продовжити покупки</a>
        </div>
    </div>

    <script>
        const cartContainer = document.getElementById("cart-items");
        const totalPriceEl = document.getElementById("total-price");
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function renderCart() {
            cartContainer.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = "<p>Кошик порожній 🛒</p>";
                totalPriceEl.textContent = 0;
                return;
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;

                cartContainer.innerHTML += `
                    <div class="card col-3 m-2">
                        <img src="${item.image}" class="card-img-top" alt="${item.title}">
                        <div class="card-body">
                            <h5>${item.title}</h5>
                            <p>${item.price} грн × ${item.quantity}</p>
                            <p><strong>${item.price * item.quantity} грн</strong></p>
                            <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Видалити</button>
                        </div>
                    </div>
                `;
            });

            totalPriceEl.textContent = total;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
